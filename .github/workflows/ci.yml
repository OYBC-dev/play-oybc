name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm --filter game-core test
      - run: pnpm --filter web lint
      - run: pnpm --filter web test
      - run: pnpm --filter web build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm i -g firebase-tools
      - run: pnpm --filter functions test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm i -g firebase-tools
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  ios:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.spm
          key: spm-${{ runner.os }}-${{ hashFiles('ios/project.yml') }}
      - run: brew install xcodegen
      - name: Dummy GoogleService-Info.plist
        run: cp ios/PlayOYBC/GoogleService-Info.template.plist ios/PlayOYBC/GoogleService-Info.plist
      - run: cd ios && xcodegen generate
      - name: Test
        run: |
          cd ios
          xcodebuild test -project PlayOYBC.xcodeproj -scheme PlayOYBC \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/.spm"
      - name: Snapshot tests
        continue-on-error: true # TEMP: CI re-record, reverted before merge
        env:
          # Informational: the test file's per-call `record: .missing` takes precedence over this
          # env var. A missing baseline still fails the run, because `.missing` records the PNG
          # on the runner and fails that assertion (nothing is committed back).
          SNAPSHOT_TESTING_RECORD: never
        run: |
          cd ios
          xcodebuild test -project PlayOYBC.xcodeproj -scheme PlayOYBCSnapshotTests \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/.spm"
      - name: Upload recorded snapshots # TEMP: CI re-record, reverted before merge
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: ios/PlayOYBCSnapshotTests/__Snapshots__

name: PlayOYBC
options:
  bundleIdPrefix: com.oybc
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 11.15.0
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    exactVersion: 1.19.2
targets:
  PlayOYBC:
    type: application
    platform: iOS
    sources:
      - path: PlayOYBC
        excludes:
          - "GoogleService-Info.template.plist"
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
    info:
      path: PlayOYBC/Info.plist
      properties:
        CFBundleDisplayName: Play OYBC
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIAppFonts:
          - BricolageGrotesque-Bold.ttf
          - BricolageGrotesque-ExtraBold.ttf
          - Archivo-Regular.ttf
          - Archivo-Medium.ttf
          - Archivo-SemiBold.ttf
          - Archivo-Bold.ttf
          - Archivo-ExtraBold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oybc.PlayOYBC
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  PlayOYBCTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PlayOYBCTests
    dependencies:
      - target: PlayOYBC
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.oybc.PlayOYBCTests
  # Snapshot tests. Baselines are found via #file (source-relative), never the bundle,
  # so the PNG tree is excluded from the target's sources.
  PlayOYBCSnapshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PlayOYBCSnapshotTests
        excludes:
          - "**/__Snapshots__/**"
    dependencies:
      - target: PlayOYBC
      - package: SnapshotTesting
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.oybc.PlayOYBCSnapshotTests
schemes:
  PlayOYBC:
    build:
      targets:
        PlayOYBC: all
        PlayOYBCTests: [test]
    test:
      targets:
        - PlayOYBCTests
  PlayOYBCSnapshotTests:
    build:
      targets:
        PlayOYBC: all
        PlayOYBCSnapshotTests: [test]
    test:
      targets:
        - PlayOYBCSnapshotTests
